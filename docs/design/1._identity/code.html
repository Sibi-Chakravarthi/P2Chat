<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#131315;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-container": "#815f00", "surface-container": "#201f22", "on-tertiary": "#402d00", "surface-dim": "#131315", "surface-container-lowest": "#0e0e10", "inverse-surface": "#e5e1e4", "tertiary-container": "#ffdf9f", "on-primary-fixed": "#1a1c1c", "outline-variant": "#444748", "surface-container-high": "#2a2a2c", "error": "#ffb4ab", "primary-fixed-dim": "#c6c6c7", "on-surface": "#e5e1e4", "secondary-container": "#00bd85", "primary-fixed": "#e2e2e2", "on-tertiary-fixed-variant": "#5c4300", "tertiary-fixed-dim": "#f9bd22", "on-tertiary-fixed": "#261a00", "on-primary": "#2f3131", "inverse-primary": "#5d5f5f", "surface-tint": "#c6c6c7", "on-primary-fixed-variant": "#454747", "secondary": "#45dfa4", "primary": "#ffffff", "surface-variant": "#353437", "surface-container-low": "#1c1b1d", "error-container": "#93000a", "surface-container-highest": "#353437", "tertiary": "#ffffff", "on-secondary-container": "#00452e", "on-surface-variant": "#c4c7c8", "on-background": "#e5e1e4", "on-error": "#690005", "outline": "#8e9192", "on-primary-container": "#636565", "secondary-fixed": "#68fcbf", "on-secondary-fixed-variant": "#005137", "surface": "#131315", "on-secondary": "#003825", "tertiary-fixed": "#ffdf9f", "background": "#131315", "on-error-container": "#ffdad6", "secondary-fixed-dim": "#45dfa4", "primary-container": "#e2e2e2", "inverse-on-surface": "#313032", "surface-bright": "#39393b", "on-secondary-fixed": "#002114" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "margin": "1rem", "gutter": "1rem", "space-lg": "1rem", "gutter-lg": "1.5rem", "space-xl": "1.5rem", "gutter-sm": "0.75rem", "margin-sm": "0.75rem", "margin-lg": "2rem", "space-xs": "0.25rem", "space-md": "0.75rem", "space-sm": "0.5rem", "space-2xl": "2.5rem" }, "fontFamily": { "headline-md": ["Inter"], "body-md": ["Inter"], "headline-lg-mobile": ["Inter"], "label-mono-lg": ["JetBrains Mono"], "body-lg": ["Inter"], "headline-sm": ["Inter"], "label-mono-md": ["JetBrains Mono"], "body-sm": ["Inter"], "label-mono-sm": ["JetBrains Mono"], "headline-lg": ["Inter"] }, "fontSize": { "headline-md": ["20px", {"lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "500"}], "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.005em", "fontWeight": "400"}], "headline-lg-mobile": ["24px", {"lineHeight": "30px", "letterSpacing": "-0.015em", "fontWeight": "500"}], "label-mono-lg": ["13px", {"lineHeight": "18px", "letterSpacing": "-0.01em", "fontWeight": "500"}], "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400"}], "headline-sm": ["16px", {"lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "500"}], "label-mono-md": ["11px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "400"}], "body-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400"}], "label-mono-sm": ["10px", {"lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "400"}], "headline-lg": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "500"}] } } } };</script></head><body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col"><main class="flex-1 w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-margin-lg pb-space-xl">
<!-- Header section -->
<header class="flex flex-col space-y-space-xs mt-space-md">
<div class="flex items-center justify-between">
<span class="font-label-mono-sm text-label-mono-sm text-secondary tracking-widest uppercase flex items-center gap-space-xs">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-secondary"></span>
        Secp256k1 • Ephemeral
      </span>
<span class="font-label-mono-sm text-label-mono-sm text-outline">v0.4.1</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Your Identity</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
      Local cryptographic key generated on device. No servers, clouds, or phone numbers.
    </p>
</header>
<!-- Interactive Alias Input -->
<section class="mt-space-2xl">
<div class="flex items-center justify-between mb-space-xs">
<label class="font-label-mono-sm text-label-mono-sm text-outline uppercase tracking-wider" for="alias-input">Node Alias</label>
<span class="font-label-mono-sm text-label-mono-sm text-outline" id="char-counter">4/32</span>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md py-space-sm transition-colors focus-within:bg-surface-container">
<span class="font-label-mono-md text-label-mono-md text-outline mr-space-xs select-none">@</span>
<input autocomplete="off" class="bg-transparent font-headline-sm text-headline-sm text-primary w-full outline-none placeholder:text-outline caret-secondary" id="alias-input" maxlength="32" placeholder="node_handle" spellcheck="false" type="text" value="sibi"/>
<button class="text-outline hover:text-primary transition-colors p-1 flex items-center justify-center" id="regenerate-alias" title="Generate random alias" type="button">
<span class="material-symbols-outlined text-[18px]">cached</span>
</button>
</div>
</section>
<!-- QR Matrix and Monospace Signature -->
<section class="flex flex-col items-center justify-center mt-space-2xl mb-space-xl">
<div class="relative p-space-lg rounded-2xl bg-surface-container-lowest flex flex-col items-center">
<!-- Minimal Corner Accents -->
<div class="absolute top-2 left-2 w-2.5 h-2.5 border-t border-l border-outline-variant"></div>
<div class="absolute top-2 right-2 w-2.5 h-2.5 border-t border-r border-outline-variant"></div>
<div class="absolute bottom-2 left-2 w-2.5 h-2.5 border-b border-l border-outline-variant"></div>
<div class="absolute bottom-2 right-2 w-2.5 h-2.5 border-b border-r border-outline-variant"></div>
<!-- High contrast QR -->
<div class="p-space-sm bg-primary rounded-lg flex items-center justify-center">
<svg aria-label="Cryptographic Peer Identity QR" class="w-48 h-48" fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Outer Position Marker Top Left -->
<rect fill="#131315" height="28" rx="2" width="28" x="6" y="6"></rect>
<rect fill="#ffffff" height="20" width="20" x="10" y="10"></rect>
<rect fill="#131315" height="12" rx="1" width="12" x="14" y="14"></rect>
<!-- Outer Position Marker Top Right -->
<rect fill="#131315" height="28" rx="2" width="28" x="66" y="6"></rect>
<rect fill="#ffffff" height="20" width="20" x="70" y="10"></rect>
<rect fill="#131315" height="12" rx="1" width="12" x="74" y="14"></rect>
<!-- Outer Position Marker Bottom Left -->
<rect fill="#131315" height="28" rx="2" width="28" x="6" y="66"></rect>
<rect fill="#ffffff" height="20" width="20" x="10" y="70"></rect>
<rect fill="#131315" height="12" rx="1" width="12" x="14" y="74"></rect>
<!-- Data pattern blocks -->
<rect fill="#131315" height="4" width="4" x="38" y="8"></rect>
<rect fill="#131315" height="4" width="8" x="46" y="8"></rect>
<rect fill="#131315" height="8" width="4" x="38" y="16"></rect>
<rect fill="#131315" height="4" width="4" x="46" y="20"></rect>
<rect fill="#131315" height="12" width="4" x="54" y="12"></rect>
<rect fill="#131315" height="8" width="4" x="8" y="38"></rect>
<rect fill="#131315" height="4" width="8" x="16" y="42"></rect>
<rect fill="#131315" height="4" width="4" x="28" y="38"></rect>
<rect fill="#131315" height="8" width="8" x="38" y="38"></rect>
<rect fill="#131315" height="4" width="12" x="50" y="38"></rect>
<rect fill="#131315" height="8" width="4" x="50" y="46"></rect>
<rect fill="#131315" height="8" width="8" x="58" y="46"></rect>
<rect fill="#131315" height="4" width="8" x="70" y="38"></rect>
<rect fill="#131315" height="4" width="10" x="82" y="38"></rect>
<rect fill="#131315" height="10" width="4" x="78" y="46"></rect>
<rect fill="#131315" height="4" width="6" x="86" y="46"></rect>
<rect fill="#131315" height="12" width="4" x="38" y="58"></rect>
<rect fill="#131315" height="4" width="8" x="46" y="58"></rect>
<rect fill="#131315" height="4" width="12" x="46" y="66"></rect>
<rect fill="#131315" height="8" width="4" x="54" y="74"></rect>
<rect fill="#131315" height="8" width="4" x="66" y="58"></rect>
<rect fill="#131315" height="8" width="8" x="74" y="62"></rect>
<rect fill="#131315" height="12" width="6" x="86" y="58"></rect>
<rect fill="#131315" height="4" width="8" x="66" y="74"></rect>
<rect fill="#131315" height="4" width="14" x="78" y="78"></rect>
<rect fill="#131315" height="4" width="6" x="86" y="70"></rect>
<rect fill="#131315" height="6" width="12" x="66" y="86"></rect>
<rect fill="#131315" height="6" width="10" x="82" y="86"></rect>
<rect fill="#131315" height="6" width="8" x="38" y="86"></rect>
<rect fill="#131315" height="4" width="8" x="50" y="82"></rect>
<rect fill="#131315" height="4" width="12" x="46" y="90"></rect>
</svg>
</div>
</div>
<!-- Fingerprint Token -->
<div class="mt-space-md flex flex-col items-center">
<div class="flex items-center gap-space-xs cursor-pointer px-space-sm py-space-xs rounded-full hover:bg-surface-container-high transition-colors" id="copy-fingerprint-btn" role="button" tabindex="0">
<span class="font-label-mono-md text-label-mono-md tracking-wider text-outline" id="fingerprint-text">a4f9 82c1 09e3 77b2</span>
<span class="material-symbols-outlined text-[14px] text-outline" id="copy-icon">content_copy</span>
</div>
<span class="font-label-mono-sm text-label-mono-sm text-secondary opacity-0 transition-opacity duration-200 mt-1" id="copy-toast">Fingerprint copied</span>
</div>
</section>
<!-- Action Controls -->
<div class="mt-auto flex flex-col space-y-space-sm pt-space-md">
<button class="w-full bg-primary text-on-primary py-3.5 px-space-md rounded-full font-headline-sm text-headline-sm tracking-tight text-center active:scale-[0.98] transition-transform select-none flex items-center justify-center gap-space-xs" id="continue-btn" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="w-full bg-surface-container-low text-primary py-3.5 px-space-md rounded-full font-headline-sm text-headline-sm tracking-tight text-center active:scale-[0.98] hover:bg-surface-container transition-all select-none flex items-center justify-center gap-space-xs" id="scan-btn" type="button">
<span class="material-symbols-outlined text-[18px] text-outline">qr_code_scanner</span>
<span>Scan Peer QR</span>
</button>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('alias-input');
    const counter = document.getElementById('char-counter');
    const copyBtn = document.getElementById('copy-fingerprint-btn');
    const copyText = document.getElementById('fingerprint-text');
    const copyToast = document.getElementById('copy-toast');
    const regenBtn = document.getElementById('regenerate-alias');
    const randomAliases = ['sibi', 'kuro', 'noda', 'solon', 'zephyr', 'nulla', 'pixel'];

    if (input && counter) {
      input.addEventListener('input', () => {
        counter.textContent = `${input.value.length}/32`;
      });
    }

    if (regenBtn && input && counter) {
      regenBtn.addEventListener('click', () => {
        const next = randomAliases[Math.floor(Math.random() * randomAliases.length)];
        input.value = next;
        counter.textContent = `${next.length}/32`;
      });
    }

    if (copyBtn && copyToast && copyText) {
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(copyText.textContent.trim());
        } catch (_) {}
        copyToast.classList.remove('opacity-0');
        setTimeout(() => {
          copyToast.classList.add('opacity-0');
        }, 1600);
      });
    }
  })();
</script></main></body></html>
