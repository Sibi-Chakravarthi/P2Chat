[project]
name = "p2chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sibi Chakravarthi", email = "sibichakravarthima31@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "bumble>=0.0.235",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pycryptodome>=3.24.0",
    "scikit-learn>=1.9.1",
    "tensorflow-cpu>=2.21.0",
    "transformers>=5.20.1",
]

[project.scripts]
p2chat = "p2chat:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
